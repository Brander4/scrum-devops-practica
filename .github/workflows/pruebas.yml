
name: Pruebas automaticas

on:
  push:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar pruebas unitarias
        run: python -m unittest -v
